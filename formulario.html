<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Cadastro de Aluno</title>
</head>

<body>

<h1>Cadastro de Aluno</h1>

<form>

<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>

<br><br>

<label for="email">E-mail:</label>
<input type="email" id="email" name="email" required>

<br><br>

<label for="cpf">CPF:</label>
<input 
type="text"
id="cpf"
name="cpf"
pattern="[0-9]{11}"
inputmode="numeric"
aria-describedby="cpf-dica"
required>

<small id="cpf-dica">Digite apenas os 11 números do CPF.</small>

<br><br>

<label for="data">Data de nascimento:</label>
<input type="date" id="data" name="data">

<br><br>

<label for="curso">Curso:</label>

<select id="curso" name="curso">

<option value="">Selecione</option>
<option value="ads">ADS</option>
<option value="cc">Engenharia de Software</option>
<option value="cd">Ciência de Dados</option>
<option value="cc">Engenharia da Computação</option>
<option value="cc">Administração</option>
<option value="cc">Economia</option>



</select>

<br><br>

<fieldset>

<legend>Turno</legend>

<label>
<input type="radio" name="turno" value="manha">
Manhã
</label>

<label>
<input type="radio" name="turno" value="tarde">
Tarde
</label>

<label>
<input type="radio" name="turno" value="noite">
Noite
</label>

</fieldset>

<br><br>

<label>
<input type="checkbox" required>
Aceito os termos
</label>

<br><br>

<button type="submit">Enviar</button>
<button type="reset">Limpar</button>

</form>

</body>

</html>
