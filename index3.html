    *{
        background-color: aliceblue;
    }
</style>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<header class="rodapecima" ><h1 style="background-color: lightblue;">Cadastro de Aluno</h1></header><br><br>
<body>

    
    <form action="/cadastrar" method="post">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="data">Data de Nascimento</label>
        <input type="date" id="data" name="data" required><br><br>

        <label for="curso">Curso</label>
        <select name="curso" id="curso">
            <option value="cdia">Ciencia de dados</option>
            <option value="es">Engenharia de Software</option>
            <option value="ec">Engenharia da Computação</option>
        </select><br><br>

        <label for="turno">Turno</label>
        <select name="" id="">
            <option value="m">Manhã</option>
            <option value="t">Tarde</option>
            <option value="n">Noite</option>
        </select><br><br>

        <button class="botao" type="submit">Enviar</button>
    </form><br>

    <a class="botao" href="index2.html">Voltar a Página incial</a>
    
</body>
</html>
